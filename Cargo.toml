[package]
name = "gitproxy"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
axum = { version = "0.8.9", features = ["tokio", "http1"] }
buffa = { version = "0.8", features = ["json"] }
buffa-types = { version = "0.8", features = ["json"] }
connectrpc = { version = "0.8", features = ["axum", "client"] }
dashmap = "6.2.1"
envy = "0.4.2"
futures = "0.3.34"
git2 = { version = "0.21.0", features = ["vendored-libgit2"] }
http = "1.5.0"
jiff = "0.2.35"
json-patch = "4.2.0"
protovalidate-buffa = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
assertables = "10.1.0"
cliclack = "0.5.6"
console = "0.16.4"
tempfile = "3.27.0"
yansi = "1.0.1"
